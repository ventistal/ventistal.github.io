<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Ventistål</title>
  <link rel="stylesheet" href="/shared/styles/main.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <section aria-labelledby="titulo">
        <div class="eyebrow"><span class="dot" aria-hidden="true"></span>Navigation panel</div>
        <img
  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5-gLaC4OBOVElnVGzTM-eEpeROvbcVvUE9N06EJJ0smMKU4LGSEnKwNg&s=10"
  alt="Image description"
  style="width: 32px; height: 32px; object-fit: contain; vertical-align: middle;"
>
        <h1 id="titulo">Ventistål</h1>
        <p class="subtitle">Explore the products in development.</p>
      </section>
      <aside class="quick" aria-label="Summary">
        <strong>1</strong>
        <span>product</span>
      </aside>
    </header>

    <section class="grid" aria-label="Products">
      <a class="card" href="registration-form/index.html" aria-label="Open Registration Form">
        <div>
          <div class="icon" aria-hidden="true">📝</div>
          <h2>Registration Form</h2>
          <p>User stories, requirements, workflows, decisions, and test cases for the registration form.</p>
        </div>
        <span class="cta">Open product <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </section>

    <footer>
      <span>Ventistål · Product dashboard</span>
      <div class="lang-switcher" data-lang-switcher></div>
    </footer>
  </main>
  <script src="/shared/js/footer.js" defer></script>
</body>
</html>
